name: Web quality gate
description: Fail a pull request when a built static site gets heavier, loses SEO basics, or gains accessibility problems.
inputs:
  dist:
    description: Folder containing the built site
    default: dist
  lighthouse:
    description: Run Lighthouse CI as well as the page and link checks
    default: 'true'
  max-image-kb:
    description: Largest image a page may load, in KB
    default: '300'
  min-text:
    description: Fewest characters of text a page's HTML may contain
    default: '200'
  canonical:
    description: Require a canonical link on every page
    default: 'true'
runs:
  using: composite
  steps:
    # Note: in GitHub expressions an empty string is falsy, so `cond && '' || 'x'` always
    # yields 'x'. Put the non-empty value first.
    - shell: bash
      run: >
        node "${{ github.action_path }}/bin/gate.mjs" "${{ inputs.dist }}"
        --max-image-kb=${{ inputs.max-image-kb }} --min-text=${{ inputs.min-text }}
        ${{ inputs.lighthouse != 'true' && '--no-lighthouse' || '' }}
        ${{ inputs.canonical != 'true' && '--no-canonical' || '' }}
