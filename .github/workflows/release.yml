# Publishes to npm when a version tag is pushed (git tag v0.2.0 && git push --tags).
# Uses npm Trusted Publishing (OIDC): no npm token is stored, and the package gets provenance.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Smoke test
        run: |
          mkdir -p /tmp/site && printf '<!doctype html><html lang="en"><head><title>T</title><meta name="description" content="d"><link rel="canonical" href="/"></head><body><main>%s</main></body></html>' "$(printf 'text %.0s' $(seq 60))" > /tmp/site/index.html
          node bin/gate.mjs /tmp/site --no-lighthouse
      - name: Publish (skipped if this version is already on npm)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "web-quality-gate@$v" version >/dev/null 2>&1; then echo "web-quality-gate@$v already published"; else npm publish --provenance --access public; fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
